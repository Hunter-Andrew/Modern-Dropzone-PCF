name: Build solution

on:
  # Every branch push builds (this also covers pull requests from branches in
  # this repo). v* tags also publish a release.
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      - name: Check the version is the same everywhere
        run: npm run version:check

      - name: Run unit tests
        run: npm test

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version}."
            exit 1
          fi

      # Builds the control in production mode (including ESLint) and packs it
      # into both an unmanaged and a managed solution zip.
      - name: Build solution
        working-directory: Solution/ModernDropzone
        run: dotnet build --configuration Release -p:SolutionPackageType=Both
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"

      - name: Upload solution zips
        uses: actions/upload-artifact@v4
        with:
          name: ModernDropzone-solution
          path: Solution/ModernDropzone/bin/Release/*.zip
          if-no-files-found: error

  release:
    # Pushing a tag such as v2.9.6 attaches the zips to a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ModernDropzone-solution

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
